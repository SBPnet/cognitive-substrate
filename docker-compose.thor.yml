# OpenSearch cluster for thor (Pop!_OS, 160GB RAM).
#
# Topology
#   opensearch-node1   cluster-manager + data + ingest     9200 / 9300
#   opensearch-node2   data + ingest                       9201 / 9301
#   opensearch-ml1     ml only (no data, no manager)       9202 / 9302
#   opensearch-ml2     ml only (no data, no manager)       9203 / 9303
#   opensearch-dashboards (profile: dashboards)             5601
#
# Heap sizing (rule: 50% of RAM up to 32GB per node, never exceed 31g)
#   node1 / node2 : 24g  — data nodes need headroom for shard field data cache
#   ml1           : 16g  — original ML node; adequate for small models (MiniLM)
#   ml2           : 24g  — second ML node; larger heap for BGE-M3 / nomic-embed-text
#                          Total committed: 88g JVM + ~30g native ≈ 118g of 157g RAM
#
# Prerequisites (run once on thor, survives reboots via /etc/sysctl.d):
#   echo "vm.max_map_count=262144" | sudo tee /etc/sysctl.d/99-opensearch.conf
#   sudo sysctl -p /etc/sysctl.d/99-opensearch.conf
#
# Persistent volumes are Docker named volumes; data survives container restarts.
# To blow everything away: docker compose -f docker-compose.thor.yml down -v
#
# Usage:
#   # Thor live stack was first created with compose project name "docker".
#   # Always pass -p docker so named volumes (docker_opensearch-*-data) are reused:
#   docker compose -p docker -f docker-compose.thor.yml up -d
#   docker compose -p docker -f docker-compose.thor.yml --profile dashboards up -d opensearch-dashboards
#   DASHBOARDS_URL=http://thor:5601 ./scripts/thor/bootstrap-dashboards.sh
#   docker compose -p docker -f docker-compose.thor.yml logs -f opensearch-node1
#   docker compose -p docker -f docker-compose.thor.yml down          # stop, keep data
#   docker compose -p docker -f docker-compose.thor.yml down -v       # stop, delete data
#
# Rolling upgrade one node (example):
#   docker compose -p docker -f docker-compose.thor.yml up -d --no-deps --force-recreate opensearch-ml2

x-opensearch-common: &opensearch-common
  image: opensearchproject/opensearch:3.6.0
  restart: unless-stopped
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 65536
      hard: 65536
  environment: &opensearch-env
    cluster.name: cognitive-substrate
    discovery.seed_hosts: opensearch-node1,opensearch-node2,opensearch-ml1,opensearch-ml2
    cluster.initial_cluster_manager_nodes: opensearch-node1
    # Security disabled for local experiment use — enable before any network exposure.
    DISABLE_SECURITY_PLUGIN: "true"
    # ML Commons settings
    plugins.ml_commons.allow_registering_model_via_url: "true"
    plugins.ml_commons.allow_registering_model_via_local_file: "true"
    # Native memory threshold: allow ML node to use up to 90% of native memory for models.
    plugins.ml_commons.native_memory_threshold: "90"
    # JVM threshold: 0 = disabled, let native memory limit govern.
    plugins.ml_commons.jvm_heap_memory_threshold: "0"
    # Pin all ML inference to the dedicated ml node.
    plugins.ml_commons.only_run_on_ml_node: "true"
    # Allow up to 10 models loaded simultaneously on the ML node.
    plugins.ml_commons.max_model_on_node: "10"
    # Lucene is the knn engine used by our schemas (faiss removed after Exp 49).
    knn.algo_param.index_thread_qty: "4"

services:
  # ---------------------------------------------------------------------------
  # Node 1 — cluster-manager + data + ingest
  # ---------------------------------------------------------------------------
  opensearch-node1:
    <<: *opensearch-common
    container_name: opensearch-node1
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      <<: *opensearch-env
      node.name: opensearch-node1
      node.roles: cluster_manager,data,ingest
      # 24g heap: large enough for data node field data cache and segment memory.
      OPENSEARCH_JAVA_OPTS: "-Xms24g -Xmx24g -XX:+UseG1GC -XX:G1HeapRegionSize=32m"
      # Expose REST on all interfaces so other containers and the host can reach it.
      network.host: "0.0.0.0"
      http.port: "9200"
      transport.port: "9300"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:9200/_cluster/health | grep -qE '"status":"(green|yellow)"'
      interval: 20s
      timeout: 15s
      retries: 20
      start_period: 120s
    volumes:
      - opensearch-node1-data:/usr/share/opensearch/data

  # ---------------------------------------------------------------------------
  # Node 2 — data + ingest
  # ---------------------------------------------------------------------------
  opensearch-node2:
    <<: *opensearch-common
    container_name: opensearch-node2
    ports:
      - "9201:9200"
      - "9301:9300"
    environment:
      <<: *opensearch-env
      node.name: opensearch-node2
      node.roles: data,ingest
      OPENSEARCH_JAVA_OPTS: "-Xms24g -Xmx24g -XX:+UseG1GC -XX:G1HeapRegionSize=32m"
      network.host: "0.0.0.0"
      http.port: "9200"
      transport.port: "9300"
    depends_on:
      opensearch-node1:
        condition: service_healthy
    volumes:
      - opensearch-node2-data:/usr/share/opensearch/data

  # ---------------------------------------------------------------------------
  # ML node — dedicated ML Commons inference, no data shards
  # ---------------------------------------------------------------------------
  opensearch-ml1:
    <<: *opensearch-common
    container_name: opensearch-ml1
    ports:
      - "9202:9200"
      - "9302:9300"
    environment:
      <<: *opensearch-env
      node.name: opensearch-ml1
      node.roles: ml
      # 16g JVM heap; the bulk of model memory is native (outside JVM heap).
      # With native_memory_threshold=90 and ~160GB system RAM, models up to
      # ~80GB native fit — more than enough for Nomic (768d), BGE-M3 (1024d),
      # and Qwen3-Embedding-0.6B simultaneously.
      OPENSEARCH_JAVA_OPTS: "-Xms16g -Xmx16g -XX:+UseG1GC"
      network.host: "0.0.0.0"
      http.port: "9200"
      transport.port: "9300"
    depends_on:
      opensearch-node1:
        condition: service_healthy
    volumes:
      - opensearch-ml1-data:/usr/share/opensearch/data

  # ---------------------------------------------------------------------------
  # ML node 2 — second dedicated ML Commons inference node
  #
  # Gives the cluster two independent JVMs for ML inference:
  #   - ML Commons round-robins _predict calls across both nodes, so two
  #     concurrent embedding requests are handled in parallel.
  #   - Deploy different models on ml1 vs ml2 with no memory contention.
  #   - 24g heap matches the data nodes; larger native headroom for models
  #     like BGE-M3 (~2-4GB native) or nomic-embed-text (~1-2GB native).
  #
  # To start without disrupting the running cluster:
  #   docker compose -f docker-compose.thor.yml up -d opensearch-ml2
  # ---------------------------------------------------------------------------
  opensearch-ml2:
    <<: *opensearch-common
    container_name: opensearch-ml2
    ports:
      - "9203:9200"
      - "9303:9300"
    environment:
      <<: *opensearch-env
      node.name: opensearch-ml2
      node.roles: ml
      OPENSEARCH_JAVA_OPTS: "-Xms24g -Xmx24g -XX:+UseG1GC -XX:G1HeapRegionSize=32m"
      network.host: "0.0.0.0"
      http.port: "9200"
      transport.port: "9300"
    depends_on:
      opensearch-node1:
        condition: service_healthy
    volumes:
      - opensearch-ml2-data:/usr/share/opensearch/data

  # ---------------------------------------------------------------------------
  # Dashboards — optional dev UI (not started by default)
  #   docker compose -f docker-compose.thor.yml --profile dashboards up -d
  # http://thor:5601 — bootstrap index patterns: scripts/thor/bootstrap-dashboards.sh
  # ---------------------------------------------------------------------------
  opensearch-dashboards:
    profiles: [dashboards]
    image: opensearchproject/opensearch-dashboards:3.6.0
    container_name: opensearch-dashboards
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch-node1:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      opensearch-node1:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Kafka — KRaft single-broker, PLAINTEXT on 9092 (TLS handled by Cloudflare
  #         Tunnel), CONTROLLER on 9093 (internal quorum only).
  #
  # External clients (blog VPS) reach this via the thor-substrate Cloudflare
  # Tunnel (thor.bigpines.net → tcp://localhost:9092). The tunnel provides
  # transport security so Kafka-level TLS is not needed.
  #
  # Listener layout:
  #   PLAINTEXT://0.0.0.0:9092  — broker; advertised as thor:9092
  #   CONTROLLER://0.0.0.0:9093 — KRaft controller quorum, not exposed
  #
  # Single-broker: replication factor 1 enforced by
  # KAFKA_TOPIC_REPLICATION_FACTOR=1 in any worker calling ensureKafkaTopics.
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two data listeners:
      #   INTERNAL (29092) — container-to-container on the Docker network
      #   PLAINTEXT (9092)  — external clients (Tailscale, host, Cloudflare tunnel)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,PLAINTEXT://100.113.192.75:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Schema Registry (Confluent, Apache 2.0 — consistent with cp-kafka above)
  # ---------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: schema-registry
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # ClickHouse — telemetry ground truth store
  #
  # Receives metrics_raw and cognitive_events from the telemetry-worker and
  # reinforcement-worker. Single-node, local deployment.
  #
  # HTTP API : http://localhost:8123
  # Native TCP: localhost:9009
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9009:9009"
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: substrate
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:8123/ping | grep -q Ok
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object store for raw ExperienceEvent ground truth
  #
  # S3 API   : http://localhost:9000  (endpoint for workers)
  # Console  : http://localhost:9001  (browser UI)
  # Bucket   : cognitive-substrate  (created manually or via mc on first run)
  #
  # Credentials (local only — not exposed externally):
  #   MINIO_ROOT_USER     = minioadmin
  #   MINIO_ROOT_PASSWORD = minioadmin
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  opensearch-node1-data:
  opensearch-node2-data:
  opensearch-ml1-data:
  opensearch-ml2-data:
  kafka-data:
  clickhouse-data:
  minio-data:
