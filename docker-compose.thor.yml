# OpenSearch cluster for thor (Pop!_OS, 160GB RAM).
#
# Topology
#   opensearch-node1   cluster-manager + data + ingest     9200 / 9300
#   opensearch-node2   data + ingest                       9201 / 9301
#   opensearch-ml1     ml only (no data, no manager)       9202 / 9302
#   opensearch-ml2     ml only (no data, no manager)       9203 / 9303
#   opensearch-dashboards                                   5601
#
# Heap sizing (rule: 50% of RAM up to 32GB per node, never exceed 31g)
#   node1 / node2 : 24g  — data nodes need headroom for shard field data cache
#   ml1           : 16g  — original ML node; adequate for small models (MiniLM)
#   ml2           : 24g  — second ML node; larger heap for BGE-M3 / nomic-embed-text
#                          Total committed: 88g JVM + ~30g native ≈ 118g of 157g RAM
#
# Prerequisites (run once on thor, survives reboots via /etc/sysctl.d):
#   echo "vm.max_map_count=262144" | sudo tee /etc/sysctl.d/99-opensearch.conf
#   sudo sysctl -p /etc/sysctl.d/99-opensearch.conf
#
# Persistent volumes are Docker named volumes; data survives container restarts.
# To blow everything away: docker compose -f docker-compose.thor.yml down -v
#
# Usage:
#   docker compose -f docker-compose.thor.yml up -d
#   docker compose -f docker-compose.thor.yml logs -f opensearch-node1
#   docker compose -f docker-compose.thor.yml down          # stop, keep data
#   docker compose -f docker-compose.thor.yml down -v       # stop, delete data

x-opensearch-common: &opensearch-common
  image: opensearchproject/opensearch:3.0.0
  restart: unless-stopped
  ulimits:
    memlock:
      soft: -1
      hard: -1
    nofile:
      soft: 65536
      hard: 65536
  environment: &opensearch-env
    cluster.name: cognitive-substrate
    discovery.seed_hosts: opensearch-node1,opensearch-node2,opensearch-ml1,opensearch-ml2
    cluster.initial_cluster_manager_nodes: opensearch-node1
    # Security disabled for local experiment use — enable before any network exposure.
    DISABLE_SECURITY_PLUGIN: "true"
    # ML Commons settings
    plugins.ml_commons.allow_registering_model_via_url: "true"
    plugins.ml_commons.allow_registering_model_via_local_file: "true"
    # Native memory threshold: allow ML node to use up to 90% of native memory for models.
    plugins.ml_commons.native_memory_threshold: "90"
    # JVM threshold: 0 = disabled, let native memory limit govern.
    plugins.ml_commons.jvm_heap_memory_threshold: "0"
    # Pin all ML inference to the dedicated ml node.
    plugins.ml_commons.only_run_on_ml_node: "true"
    # Allow up to 10 models loaded simultaneously on the ML node.
    plugins.ml_commons.max_model_on_node: "10"
    # Faiss is the knn engine used by our schemas — ensure the native lib loads.
    knn.algo_param.index_thread_qty: "4"

services:
  # ---------------------------------------------------------------------------
  # Node 1 — cluster-manager + data + ingest
  # ---------------------------------------------------------------------------
  opensearch-node1:
    <<: *opensearch-common
    container_name: opensearch-node1
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      <<: *opensearch-env
      node.name: opensearch-node1
      node.roles: cluster_manager,data,ingest
      # 24g heap: large enough for data node field data cache and segment memory.
      OPENSEARCH_JAVA_OPTS: "-Xms24g -Xmx24g -XX:+UseG1GC -XX:G1HeapRegionSize=32m"
      # Expose REST on all interfaces so other containers and the host can reach it.
      network.host: "0.0.0.0"
      http.port: "9200"
      transport.port: "9300"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:9200/_cluster/health | grep -qE '"status":"(green|yellow)"'
      interval: 20s
      timeout: 15s
      retries: 20
      start_period: 120s
    volumes:
      - opensearch-node1-data:/usr/share/opensearch/data

  # ---------------------------------------------------------------------------
  # Node 2 — data + ingest
  # ---------------------------------------------------------------------------
  opensearch-node2:
    <<: *opensearch-common
    container_name: opensearch-node2
    ports:
      - "9201:9200"
      - "9301:9300"
    environment:
      <<: *opensearch-env
      node.name: opensearch-node2
      node.roles: data,ingest
      OPENSEARCH_JAVA_OPTS: "-Xms24g -Xmx24g -XX:+UseG1GC -XX:G1HeapRegionSize=32m"
      network.host: "0.0.0.0"
      http.port: "9200"
      transport.port: "9300"
    depends_on:
      opensearch-node1:
        condition: service_healthy
    volumes:
      - opensearch-node2-data:/usr/share/opensearch/data

  # ---------------------------------------------------------------------------
  # ML node — dedicated ML Commons inference, no data shards
  # ---------------------------------------------------------------------------
  opensearch-ml1:
    <<: *opensearch-common
    container_name: opensearch-ml1
    ports:
      - "9202:9200"
      - "9302:9300"
    environment:
      <<: *opensearch-env
      node.name: opensearch-ml1
      node.roles: ml
      # 16g JVM heap; the bulk of model memory is native (outside JVM heap).
      # With native_memory_threshold=90 and ~160GB system RAM, models up to
      # ~80GB native fit — more than enough for Nomic (768d), BGE-M3 (1024d),
      # and Qwen3-Embedding-0.6B simultaneously.
      OPENSEARCH_JAVA_OPTS: "-Xms16g -Xmx16g -XX:+UseG1GC"
      network.host: "0.0.0.0"
      http.port: "9200"
      transport.port: "9300"
    depends_on:
      opensearch-node1:
        condition: service_healthy
    volumes:
      - opensearch-ml1-data:/usr/share/opensearch/data

  # ---------------------------------------------------------------------------
  # ML node 2 — second dedicated ML Commons inference node
  #
  # Gives the cluster two independent JVMs for ML inference:
  #   - ML Commons round-robins _predict calls across both nodes, so two
  #     concurrent embedding requests are handled in parallel.
  #   - Deploy different models on ml1 vs ml2 with no memory contention.
  #   - 24g heap matches the data nodes; larger native headroom for models
  #     like BGE-M3 (~2-4GB native) or nomic-embed-text (~1-2GB native).
  #
  # To start without disrupting the running cluster:
  #   docker compose -f docker-compose.thor.yml up -d opensearch-ml2
  # ---------------------------------------------------------------------------
  opensearch-ml2:
    <<: *opensearch-common
    container_name: opensearch-ml2
    ports:
      - "9203:9200"
      - "9303:9300"
    environment:
      <<: *opensearch-env
      node.name: opensearch-ml2
      node.roles: ml
      OPENSEARCH_JAVA_OPTS: "-Xms24g -Xmx24g -XX:+UseG1GC -XX:G1HeapRegionSize=32m"
      network.host: "0.0.0.0"
      http.port: "9200"
      transport.port: "9300"
    depends_on:
      opensearch-node1:
        condition: service_healthy
    volumes:
      - opensearch-ml2-data:/usr/share/opensearch/data

  # ---------------------------------------------------------------------------
  # Dashboards — cluster management and ML model registry UI
  # http://thor:5601  (or localhost:5601 from thor itself)
  # ---------------------------------------------------------------------------
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.0.0
    container_name: opensearch-dashboards
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch-node1:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      opensearch-node1:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Kafka — KRaft single-broker, TLS + SASL_SSL on 9092 (external),
  #         PLAINTEXT on 9093 (internal controller only, not exposed).
  #
  # Two listener pairs:
  #   SASL_SSL://0.0.0.0:9092   — external clients (blog VPS, ingest-worker
  #                                on other machines); advertised as
  #                                thor.bigpines.net:9092
  #   PLAINTEXT://0.0.0.0:9094  — intra-container clients (ingest-worker
  #                                running on the same Docker network);
  #                                advertised as kafka:9094
  #   CONTROLLER://0.0.0.0:9093 — KRaft controller quorum, not exposed
  #
  # TLS certs: generate once on thor (see README / runbook below) and place
  # at ~/kafka-tls/. The compose bind-mount makes them available at
  # /etc/kafka/secrets inside the container.
  #
  # SASL: SCRAM-SHA-512 credentials are bootstrapped via KAFKA_OPTS at
  # startup. Change the password in the environment block below and in
  # .env.example / blog env vars before deploying.
  #
  # Single-broker: replication factor 1 enforced by
  # KAFKA_TOPIC_REPLICATION_FACTOR=1 in any worker calling ensureKafkaTopics.
  #
  # Cert generation runbook (run once on thor):
  #   mkdir -p ~/kafka-tls && cd ~/kafka-tls
  #   openssl genrsa -out ca.key 4096
  #   openssl req -new -x509 -days 3650 -key ca.key -out ca.crt -subj "/CN=kafka-ca"
  #   openssl genrsa -out broker.key 4096
  #   openssl req -new -key broker.key -out broker.csr -subj "/CN=thor.bigpines.net"
  #   openssl x509 -req -days 3650 -in broker.csr -CA ca.crt -CAkey ca.key \
  #     -CAcreateserial -out broker.crt \
  #     -extfile <(printf "subjectAltName=DNS:thor.bigpines.net")
  #   openssl pkcs12 -export -in broker.crt -inkey broker.key -chain \
  #     -CAfile ca.crt -name broker -out broker.p12 -passout pass:kafkapass
  #   keytool -importkeystore -srckeystore broker.p12 -srcstoretype PKCS12 \
  #     -srcstorepass kafkapass -destkeystore broker.keystore.jks \
  #     -deststorepass kafkapass -noprompt
  #   keytool -importcert -file ca.crt -keystore broker.truststore.jks \
  #     -storepass kafkapass -alias CARoot -noprompt
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"   # SASL_SSL — external clients
      - "9093:9093"   # CONTROLLER — KRaft quorum (not for clients)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Three listeners: external TLS, internal plaintext, controller
      KAFKA_LISTENERS: SASL_SSL://0.0.0.0:9092,PLAINTEXT://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://thor.bigpines.net:9092,PLAINTEXT://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_SSL:SASL_SSL,PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # SASL
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN

      # TLS — certs are bind-mounted from ~/kafka-tls on the host
      KAFKA_SSL_KEYSTORE_FILENAME: broker.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: keystore_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: broker.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore_creds
      KAFKA_SSL_CLIENT_AUTH: none

      # Replication / storage
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 1

      # Bootstrap SCRAM credentials before the broker starts.
      # Change KAFKA_SASL_BLOG_PASSWORD and update blog + ingest-worker env vars.
      KAFKA_OPTS: >-
        -Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ${HOME}/kafka-tls:/etc/kafka/secrets:ro
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 > /dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  opensearch-node1-data:
  opensearch-node2-data:
  opensearch-ml1-data:
  opensearch-ml2-data:
  kafka-data:
