// JAAS config for Kafka broker SASL_SSL listener.
// Place this file at ~/kafka-tls/kafka_server_jaas.conf on thor.
// Replace CHANGEME with your chosen password — must match keystore_creds,
// truststore_creds, and the KAFKA_SASL_PASSWORD in client env vars.

KafkaServer {
    org.apache.kafka.common.security.scram.ScramLoginModule required
    username="admin"
    password="CHANGEME";
};
