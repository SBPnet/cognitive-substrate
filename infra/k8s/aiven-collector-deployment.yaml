apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognitive-substrate-aiven-collector
  labels:
    app.kubernetes.io/name: cognitive-substrate
    app.kubernetes.io/component: aiven-collector
spec:
  # Singleton: Kafka consumer group membership and the Prometheus receiver
  # port are both stateless and horizontally scalable, but log-consumer
  # offsets are managed by Kafka so multiple replicas are safe. Start at 1
  # and scale if receiver throughput demands it.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cognitive-substrate
      app.kubernetes.io/component: aiven-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cognitive-substrate
        app.kubernetes.io/component: aiven-collector
    spec:
      containers:
        - name: aiven-collector
          image: cognitive-substrate/aiven-collector:latest
          imagePullPolicy: Never
          ports:
            - name: health
              containerPort: 3000
            - name: prom-write
              containerPort: 9091
          env:
            - name: ENVIRONMENT
              value: dev
            - name: KAFKA_CLIENT_ID
              value: aiven-collector-worker
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: cognitive-substrate-aiven
                  key: kafka-brokers
            - name: KAFKA_SSL
              valueFrom:
                secretKeyRef:
                  name: cognitive-substrate-aiven
                  key: kafka-ssl
            - name: KAFKA_SASL_MECHANISM
              valueFrom:
                secretKeyRef:
                  name: cognitive-substrate-aiven
                  key: kafka-sasl-mechanism
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cognitive-substrate-aiven
                  key: kafka-username
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cognitive-substrate-aiven
                  key: kafka-password
            - name: AIVEN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cognitive-substrate-aiven
                  key: aiven-token
            - name: AIVEN_PROJECT
              valueFrom:
                secretKeyRef:
                  name: cognitive-substrate-aiven
                  key: aiven-project
            - name: AIVEN_SERVICES
              valueFrom:
                secretKeyRef:
                  name: cognitive-substrate-aiven
                  key: aiven-services
                  optional: true
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: cognitive-substrate-aiven
                  key: otel-endpoint
                  optional: true
            # Prometheus remote_write receiver port (must match Service below)
            - name: PROMETHEUS_RECEIVER_PORT
              value: "9091"
            # Kafka consumer group for Aiven kafka_logs topics
            - name: KAFKA_LOGS_GROUP_ID
              value: aiven-collector-logs
            # Topic prefix matching the kafka_logs integration config in Terraform
            - name: AIVEN_LOGS_TOPIC_PREFIX
              value: aiven.logs
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
# Service exposes the Prometheus remote_write port so Aiven can reach it.
# In production this needs an external LoadBalancer or Ingress; the ClusterIP
# type here is sufficient for in-cluster testing and local dev with port-forward.
apiVersion: v1
kind: Service
metadata:
  name: cognitive-substrate-aiven-collector
  labels:
    app.kubernetes.io/name: cognitive-substrate
    app.kubernetes.io/component: aiven-collector
spec:
  selector:
    app.kubernetes.io/name: cognitive-substrate
    app.kubernetes.io/component: aiven-collector
  ports:
    - name: health
      port: 3000
      targetPort: 3000
    - name: prom-write
      port: 9091
      targetPort: 9091
